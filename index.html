<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Feed Room Challenge | Ranch Hands 2.0</title>
<style>
:root{--navy:#102a3a;--rust:#872c21;--gold:#c68b45;--cream:#f7f4ed;--sand:#f3ede2;--ink:#24333a;--green:#276749}*{box-sizing:border-box}body{margin:0;background:#e9e4da;color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{max-width:1080px;margin:18px auto;background:white;border-radius:16px;overflow:hidden;box-shadow:0 8px 35px #102a3a22}.hero{background:var(--navy);color:white;padding:26px 30px;border-bottom:6px solid var(--gold)}.eyebrow{font-size:12px;letter-spacing:2px;color:#eacb9f;font-weight:700}.hero h1{font-size:clamp(25px,4vw,39px);margin:6px 0}.hero p{margin:4px 0;color:#f3ede2}.progress{display:flex;gap:6px;margin-top:20px}.progress span{height:7px;flex:1;border-radius:9px;background:#516777}.progress span.done{background:var(--gold)}main{padding:26px}.section-title{color:var(--rust);font-size:13px;letter-spacing:1.5px;font-weight:800}.card{border:1px solid #e0d7ca;background:var(--cream);border-radius:12px;padding:20px;margin:16px 0}.card.white{background:white}.card h2{color:var(--navy);margin:0 0 8px;font-size:25px}.card h3{color:var(--rust);margin:0 0 8px}.row{display:flex;gap:12px;flex-wrap:wrap}.tile{flex:1 1 190px;border:2px solid #ded3c4;border-radius:12px;padding:16px;background:white;text-align:left;min-width:0}.tile:hover,.tile:focus-visible{border-color:var(--gold)}.tile.selected{border-color:var(--rust);background:#fff8ee}.emoji{font-size:30px;display:block}.btn{border:0;border-radius:9px;padding:12px 18px;background:var(--navy);color:white;font-weight:700}.btn.alt{background:var(--rust)}.btn.light{background:white;color:var(--navy);border:2px solid var(--navy)}.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px}.feedback{padding:14px 17px;border-radius:9px;margin-top:15px;background:#fff2db;border-left:5px solid var(--gold)}.feedback.good{background:#e8f5eb;border-color:var(--green)}.feedback.bad{background:#fff0ed;border-color:var(--rust)}.pill{display:inline-block;padding:5px 11px;border-radius:30px;background:var(--sand);color:var(--rust);font-size:13px;font-weight:bold}.inventory{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.inventory .tile{min-height:160px}.feedlabel{border:3px solid var(--navy);padding:18px;background:#fff;max-width:530px;margin:14px auto}.feedlabel h3{text-align:center;color:var(--navy);border-bottom:5px solid var(--navy);padding-bottom:8px}.feedlabel table{width:100%;border-collapse:collapse}.feedlabel td{padding:8px;border-bottom:1px solid #bbb}.feedlabel td:last-child{text-align:right;font-weight:bold}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.metric{padding:15px;background:var(--sand);border-radius:10px;text-align:center}.metric strong{display:block;font-size:26px;color:var(--navy)}.slider{width:100%;accent-color:var(--rust)}.bar{display:flex;height:26px;border-radius:9px;overflow:hidden;background:#ddd}.bar div:first-child{background:var(--gold)}.bar div:last-child{background:var(--rust)}.notice{font-size:14px;color:#5a5047}.footer{background:var(--rust);color:white;text-align:center;padding:18px;border-top:5px solid var(--gold)}.hide{display:none!important}.print-only{display:none}@media(max-width:640px){main{padding:15px}.hero{padding:21px}.grid2{grid-template-columns:1fr}.tile{flex-basis:100%}}@media print{body{background:white}.shell{box-shadow:none;margin:0}.actions,.progress,.interactive{display:none!important}.print-only{display:block}}
</style></head><body><div class="shell"><header class="hero"><div style="font-size:34px">🌾 🐄 ⚖️</div><div class="eyebrow">RANCH HANDS 2.0 · ANIMAL SCIENCE 1B · MODULE 12</div><h1>The Feed Room Challenge</h1><p>Can You Feed the Ranch? · Explore → Decide → Calculate → Improve</p><div class="progress" id="progress" aria-label="Challenge progress"></div></header><main id="app" aria-live="polite"></main><footer class="footer"><strong>REAL ANIMALS · REAL SKILLS · BRIGHTER FUTURES</strong><div style="font-size:13px;margin-top:4px">Ranch Rule: If you don't know an answer, don't guess—go find it!</div></footer></div>
<script>
'use strict';
const feeds=[
{id:'hay',icon:'🌿',name:'Grass Hay',type:'Forage',detail:'Fiber-rich dried grass. Common forage for horses and cattle; quality varies by harvest and storage.',safety:'Check for mold, dust, weeds, and spoilage.'},
{id:'alfalfa',icon:'🍀',name:'Alfalfa Hay',type:'Forage',detail:'Legume forage that often provides more protein and calcium than mature grass hay.',safety:'Match to animal needs; avoid assuming every animal needs high-protein forage.'},
{id:'corn',icon:'🌽',name:'Cracked Corn',type:'Concentrate',detail:'Energy-dense grain, often used as one ingredient in livestock rations.',safety:'Large or sudden grain increases can cause digestive problems.'},
{id:'soy',icon:'🫘',name:'Soybean Meal',type:'Concentrate',detail:'Protein-rich ingredient used in formulated livestock diets.',safety:'Must be used in an appropriate, balanced species-specific ration.'},
{id:'mineral',icon:'🧂',name:'Species-Specific Mineral Mix',type:'Supplement',detail:'Adds selected minerals that may be lacking in the base ration.',safety:'Mineral formulations differ by species; some cattle minerals are unsafe for sheep.'},
{id:'vitamin',icon:'💊',name:'Vitamin Supplement',type:'Supplement',detail:'Supplies particular vitamins when indicated by the animal’s diet and requirements.',safety:'Extra vitamins are not automatically beneficial; follow species-appropriate directions.'}];
const animals=[
{name:'Growing Beef Calf',icon:'🐄',need:'A calf is gaining weight, but its current forage test shows modest protein. The manager has not yet calculated the total ration.',choices:['Replace all forage with grain immediately','Compare a cattle-appropriate grower supplement with the forage analysis, then balance the total ration','Choose the highest-protein feed without checking the label or intake'],answer:1,why:'A feed decision should use forage analysis and the calf’s requirements; the complete ration matters more than one impressive label value.'},
{name:'Working Horse',icon:'🐎',need:'A horse has moved from light to moderate work. Body condition is currently appropriate and hay quality is good.',choices:['Assess body condition and workload, keep adequate forage, and add energy gradually only if needed','Double grain immediately because workload increased','Use a cattle mineral product to boost performance'],answer:0,why:'Workload matters, but energy adjustments should be guided by body condition, forage quality, and gradual dietary changes.'},
{name:'Laying Hen',icon:'🐔',need:'Eggshell quality has declined. The flock has been receiving mixed scratch grains rather than a complete layer diet.',choices:['Add more scratch grain because it contains energy','Feed cattle mineral mix because minerals are minerals','Restore a balanced layer ration with appropriate calcium and check other management causes'],answer:2,why:'Scratch grains alone are not a complete layer diet. Calcium is important, but shell quality can also be affected by age, health, and management.'}
];
const steps=['welcome','explore','sort','label','animals','builder','scenario','finish'];let state={step:0,seen:[],sort:0,sortCorrect:0,label:null,animal:0,animalCorrect:0,answers:[],scenario:null,builderPassed:false,scenarioPassed:false};
const app=document.getElementById('app');function progress(){document.getElementById('progress').innerHTML=steps.map((s,i)=>`<span class="${i<=state.step?'done':''}"></span>`).join('')}
function set(html){app.innerHTML=html;progress();app.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(Number(b.dataset.go))));}function go(i){state.step=i;render();window.scrollTo({top:0,behavior:'smooth'})}function button(label,fn,cls='btn'){let b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);return b}function actions(nextLabel,fn,disabled=false){let d=document.createElement('div');d.className='actions';d.append(button('← Previous',()=>go(state.step-1),'btn light'));let n=button(nextLabel,fn);n.disabled=disabled;n.id='next';d.append(n);app.append(d)}function feedback(message,kind=''){let e=document.getElementById('feedback');if(!e){e=document.createElement('div');e.id='feedback';app.append(e)}e.className='feedback '+kind;e.innerHTML=message}
function render(){if(state.step===0)welcome();if(state.step===1)explore();if(state.step===2)sort();if(state.step===3)label();if(state.step===4)animal();if(state.step===5)builder();if(state.step===6)scenario();if(state.step===7)finish()}
function welcome(){set(`<div class="section-title">YOUR RANCH MISSION</div><div class="card"><h2>🤠 You're the New Feed Room Manager!</h2><p>Four animals need good decisions, the feed room has multiple ingredients, and your boss expects you to explain <strong>why</strong> you chose each feed.</p><p>Explore feed labels, match ingredients to their purpose, make safe feeding decisions, and build a <strong>practice ration</strong> using a live calculator.</p><span class="pill">Phase 1 · Feed Room Explorer</span> <span class="pill">Phase 2 · Ration Builder</span></div><div class="card white"><h3>How to succeed</h3><p>✓ Click through feed inventory cards and read their descriptions.<br>✓ Answer challenges and use feedback to retry.<br>✓ Complete the ration calculation and a ranch safety decision.<br>✓ Save or print your completion summary if your teacher asks.</p><p class="notice"><strong>Important:</strong> This is an educational simulation. Its simplified feed values and targets are not feeding instructions for real animals.</p></div><div class="actions"><span></span><button class="btn" data-go="1">Enter the Feed Room →</button></div>`)}
function explore(){set(`<div class="section-title">PHASE 1 · STATION 1 OF 4</div><div class="card"><h2>🌾 Explore the Feed Inventory</h2><p>Select each feed to investigate its category, nutritional role, and safety considerations. Explore all six to unlock the next station.</p><div class="inventory" id="inventory"></div><div id="detail" class="feedback">Choose a feed bin to inspect its contents.</div><p class="notice" id="seen">Inspected: ${state.seen.length} / 6</p></div>`);let inv=document.getElementById('inventory');feeds.forEach(f=>{let b=button(`${f.icon} ${f.name}`,()=>{if(!state.seen.includes(f.id))state.seen.push(f.id);document.getElementById('detail').innerHTML=`<strong>${f.type}: ${f.name}</strong><p>${f.detail}</p><strong>Safety check:</strong> ${f.safety}`;document.getElementById('seen').textContent=`Inspected: ${state.seen.length} / 6`;document.getElementById('next').disabled=state.seen.length!==6},'tile');inv.append(b)});actions('Sort the Feed →',()=>go(2),state.seen.length!==6)}
const sortQ=[
{feed:'Chopped alfalfa stems and leaves',a:'Forage',hint:'A legume harvested as roughage; it contributes fiber even though it can be protein-rich.'},
{feed:'Ground corn grain',a:'Concentrate',hint:'This ingredient is energy-dense and comparatively low in structural fiber.'},
{feed:'Trace-mineral premix',a:'Supplement',hint:'It fills small, specific nutrient gaps rather than supplying most of the diet.'},
{feed:'Processed soybean meal',a:'Concentrate',hint:'It is used primarily as a concentrated protein ingredient.'},
{feed:'Fermented chopped whole corn plant (silage)',a:'Forage',hint:'Whole-plant silage contains substantial roughage; do not confuse it with corn grain.'},
{feed:'Vitamin A–D–E premix',a:'Supplement',hint:'It targets specific micronutrients.'}];
function sort(){
 if(state.sort>=sortQ.length){set(`<div class="section-title">PHASE 1 · STATION 2 COMPLETE</div><div class="card"><h2>🏅 Feed Detective!</h2><p>You classified six ingredients by their nutritional role, including ingredients whose names can be misleading.</p></div><div class="actions"><button class="btn light" data-go="1">← Inventory</button><button class="btn" data-go="3">Investigate Feed Labels →</button></div>`);return}
 let q=sortQ[state.sort];
 set(`<div class="section-title">PHASE 1 · STATION 2 OF 4</div><div class="card"><h2>🔎 Classify by Function</h2><p><strong>Case ${state.sort+1} of ${sortQ.length}</strong></p><div class="card white"><h2>${q.feed}</h2><p>${q.hint}</p></div><p>Which feed category best fits the ingredient's role?</p><div class="row" id="choices"></div><div id="feedback" role="status"></div></div>`);
 ['Forage','Concentrate','Supplement'].forEach(c=>document.getElementById('choices').append(button(c,()=>{
 if(c===q.a){feedback(`✓ Correct. ${q.feed} is classified as ${q.a.toLowerCase()} in this context.`,'good');state.sortCorrect++;let n=button('Next Case →',()=>{state.sort++;sort()});document.getElementById('feedback').append(n);document.querySelectorAll('#choices button').forEach(x=>x.disabled=true)}
 else feedback('Reconsider its primary function: roughage/fiber, concentrated energy/protein, or targeted nutrient gap.','bad')
 },'btn light')))
}
function label(){
 set(`<div class="section-title">PHASE 1 · STATION 3 OF 4</div><div class="card"><h2>📋 Compare Two Feed Tags</h2><p>These are <strong>fictional teaching labels</strong>. Both products are labeled for growing beef cattle. The producer needs to compare them, not simply pick the larger protein number.</p>
 <div class="grid2"><div class="feedlabel"><h3>FEED A · GROWER BLEND</h3><table><tr><td>Crude protein (minimum)</td><td>14%</td></tr><tr><td>Crude fat (minimum)</td><td>3%</td></tr><tr><td>Crude fiber (maximum)</td><td>12%</td></tr></table><p>Price: $18 per 50-lb bag</p></div><div class="feedlabel"><h3>FEED B · PROTEIN BLEND</h3><table><tr><td>Crude protein (minimum)</td><td>18%</td></tr><tr><td>Crude fat (minimum)</td><td>2%</td></tr><tr><td>Crude fiber (maximum)</td><td>10%</td></tr></table><p>Price: $24 per 50-lb bag</p></div></div>
 <h3>Decision 1: Which statement is supported by these labels?</h3><div id="labelChoices" class="inventory"></div><div id="feedback" role="status"></div></div>`);
 let opts=[
 'Feed B is automatically healthier because 18% is greater than 14%.',
 'Feed A guarantees at least 7 lb crude protein in a 50-lb bag on the labeled basis; the two feeds still require a whole-ration comparison.',
 'Feed A has exactly 12% fiber and Feed B has exactly 10% fiber.'
 ];
 opts.forEach((c,i)=>document.getElementById('labelChoices').append(button(c,()=>{
 if(i===1){state.label=true;feedback('✓ Correct: 50 × 0.14 = 7 lb minimum crude protein. A maximum fiber value is a ceiling, not an exact measured amount. Protein alone cannot determine the best total ration.','good');document.getElementById('next').disabled=false}
 else feedback('Look closely at “minimum” versus “maximum,” and distinguish a nutrient guarantee from an overall feeding recommendation.','bad')
 },'tile')));
 actions('Evaluate Animal Needs →',()=>go(4),!state.label)
}
function animal(){if(state.animal>=animals.length){set(`<div class="section-title">PHASE 1 COMPLETE</div><div class="card"><h2>🏅 Animal Nutrition Scout!</h2><p>You've matched feed choices to three different animal needs. Next: calculate how feed ingredients affect a ration's protein percentage.</p></div><div class="actions"><button class="btn light" data-go="3">← Feed Label</button><button class="btn" data-go="5">Open Ration Builder →</button></div>`);return}let a=animals[state.animal];set(`<div class="section-title">PHASE 1 · STATION 4 OF 4</div><div class="card"><h2>${a.icon} Meet Your Animal</h2><span class="pill">Animal ${state.animal+1} of ${animals.length}</span><p><strong>${a.name}</strong> · Main need: ${a.need}</p><h3>Which feeding plan is most appropriate?</h3><div id="animalChoices" class="inventory"></div><div id="feedback" role="status"></div></div>`);a.choices.forEach((c,i)=>document.getElementById('animalChoices').append(button(c,()=>{if(i===a.answer){feedback(`✓ Good choice! ${a.why}`,'good');let n=button('Next Animal →',()=>{state.animal++;animal()});document.getElementById('feedback').append(n);document.querySelectorAll('#animalChoices button').forEach(x=>x.disabled=true)}else feedback('Try again. Consider the animal’s digestive system, species, and production stage.','bad')},'tile')))}
function builder(){
 set(`<div class="section-title">PHASE 2 · RATION BUILDER</div><div class="card"><h2>⚖️ Solve the Ranch Mix</h2><p>Two <strong>fictional training ingredients</strong> are available: Ingredient A contains 10% crude protein and Ingredient B contains 20%. Your goal is to make a mix containing <strong>16% crude protein (CP)</strong>. <strong>Step 1:</strong> Move the slider to choose how much of each ingredient to use. <strong>Step 2:</strong> Calculate the crude protein percentage of the mix you selected and enter that number in the box. <strong>Step 3:</strong> Click Check My Calculation. If your math is correct but your mix is not 16% CP, adjust the slider and calculate again. <strong>You must get both the calculation and the target right to continue.</strong></p>
 <div class="grid2"><div class="card white"><h3>🌽 Ingredient A · 10% CP</h3><label for="mix">Percentage of Ingredient A: <strong id="aVal">25%</strong></label><input class="slider" id="mix" type="range" min="0" max="100" step="5" value="50"><p>🫘 Ingredient B · 20% CP: <strong id="bVal">50%</strong></p><div class="bar"><div id="barA" style="width:50%"></div><div id="barB" style="width:50%"></div></div></div><div class="card white"><h3>📊 Nutrition Dashboard</h3><p><strong>Calculate the protein in your CURRENT mix</strong> (the percentages shown on the left), not the 16% target. The formula updates when you move the slider. <strong>Example:</strong> If a mix contains 50% A and 50% B, the protein is (0.50 × 10) + (0.50 × 20) = <strong>15% CP</strong>. Enter 15, not 16, for that mix.</p><p class="notice" id="formula"></p><label for="estimate"><strong>Protein percentage of the mix I selected (%)</strong></label><input id="estimate" type="number" min="0" max="100" step="0.1" placeholder="Enter %"><p class="notice">Goal: 16% CP. The ingredient amounts always total 100%. A correct calculation alone is not enough; your mix must also reach the goal.</p></div></div>
 <button id="check" class="btn alt">Check My Calculation</button><div id="feedback" role="status"></div></div>`);
 let s=document.getElementById('mix');
 function update(){let a=+s.value,b=100-a;document.getElementById('aVal').textContent=a+'%';document.getElementById('bVal').textContent=b+'%';document.getElementById('barA').style.width=a+'%';document.getElementById('barB').style.width=b+'%';document.getElementById('formula').textContent=`(${a}/100 × 10%) + (${b}/100 × 20%) = ?`;return (a*10+b*20)/100}
 s.addEventListener('input',()=>{update();document.getElementById('estimate').value='';document.getElementById('feedback').innerHTML=''});update();
 document.getElementById('check').onclick=()=>{let val=Number(document.getElementById('estimate').value),actual=update();if(!document.getElementById('estimate').value){feedback('Enter your calculated percentage before checking.','bad');return}
 if(Math.abs(val-actual)>.05){feedback(`That number does not match the CURRENT mix shown above. Multiply the fraction of Ingredient A by 10, multiply the fraction of Ingredient B by 20, then add. For example, a 50/50 mix gives 0.50 × 10 + 0.50 × 20 = 15%. Try again.`,'bad');return}
 if(Math.abs(actual-16)<.01){state.builderPassed=true;feedback('✓ Excellent! You calculated 16% CP with 40% Ingredient A and 60% Ingredient B. Remember: this is only a protein-math exercise, not a complete livestock ration.','good');document.getElementById('next').disabled=false}
 else feedback(`✓ Your calculation is correct: your selected mix has ${actual.toFixed(1)}% CP. But the ranch needs 16% CP. Move the slider, then calculate the new mix and check again.`,'good')
 };
 actions('Handle a Ranch Problem →',()=>go(6),!state.builderPassed)
}
function scenario(){
 set(`<div class="section-title">PHASE 2 · FINAL RANCH DECISION</div><div class="card"><h2>🚨 A Complicated Feed Delivery</h2><p>The delivery truck brings a mineral product labeled for beef cattle. The sheep pen is low on mineral mix, and a worker suggests using the cattle product until tomorrow. The product label does not state that it is suitable for sheep.</p><h3>What is the best next step?</h3><div id="scenarioChoices" class="inventory"></div><div id="feedback" role="status"></div></div>`);
 ['Use half the cattle mineral dose, since less is always safe','Hold the cattle mineral from the sheep; verify species-specific labeling and obtain an appropriate product','Mix the cattle mineral into hay so sheep eat less of it'].forEach((c,i)=>document.getElementById('scenarioChoices').append(button(c,()=>{if(i===1){state.scenarioPassed=true;feedback('✓ Correct. Some cattle mineral mixes contain copper levels that may be unsafe for sheep. Do not assume a smaller dose or dilution makes an unsuitable product safe. Verify the product and consult the responsible livestock professional.','good');document.getElementById('next').disabled=false}else feedback('Not safe. Sheep can be especially sensitive to excess copper; the product must be verified for the intended species.','bad')},'tile')));
 actions('View My Completion Summary →',()=>go(7),!state.scenarioPassed)
}
function finish(){set(`<div class="section-title">RANCH MISSION COMPLETE</div><div class="card" style="text-align:center;border:3px solid var(--gold)"><div style="font-size:54px">🏆</div><h2>Certified Feed Room Explorer</h2><p><strong>You completed The Feed Room Challenge!</strong></p><p>You've investigated feed ingredients, read a feed label, matched feeding plans to animal needs, solved a weighted-average ration problem, and made a feed safety decision.</p><span class="pill">🌾 Feed Detective</span> <span class="pill">🐄 Nutrition Scout</span> <span class="pill">⚖️ Ration Rookie</span> <span class="pill">🛡️ Safety First</span></div><div class="card white"><h3>📋 Completion Record</h3><p><strong>Course:</strong> Animal Science 1B · Module 12<br><strong>Activity:</strong> The Feed Room Challenge<br><strong>Status:</strong> Completed all stations<br><strong>Ration practice:</strong> 40% Ingredient A + 60% Ingredient B = 16% crude protein<br><strong>Safety decision:</strong> Correct</p><p class="notice">This record is generated in your browser and is not automatically sent to Canvas or your teacher. If your teacher requests evidence, print/save this page as a PDF or take a screenshot. Complete the Canvas mastery quiz separately.</p></div><div class="actions interactive"><button class="btn light" id="restart">↻ Start Again</button><button class="btn" id="print">Print / Save Completion</button></div><p class="print-only">Completion summary generated from the interactive practice activity.</p>`);document.getElementById('restart').onclick=()=>{state={step:0,seen:[],sort:0,sortCorrect:0,label:null,animal:0,animalCorrect:0,answers:[],scenario:null,builderPassed:false,scenarioPassed:false};render()};document.getElementById('print').onclick=()=>window.print()}
render();
</script></body></html>
